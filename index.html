<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CAYXUMMO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- SHOOTING STARS BACKGROUND -->
    <div class="shooting-stars-container">
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
        <div class="shooting_star"></div>
    </div>

    <!-- ===== THÊM MỚI: LOGIN SCREEN CHO WEB ===== -->
    <div id="loginScreen" class="login-screen" style="display:none;">
        <div class="login-box">
            <h2>🌿 CAYXUMMO</h2>
            <p style="color:#a0aec0; margin-bottom:20px;">Đăng nhập hoặc đăng ký</p>

            <div id="loginForm">
                <input type="text" id="loginUsername" placeholder="Tên đăng nhập" class="input">
                <input type="password" id="loginPassword" placeholder="Mật khẩu" class="input">
                <button class="btn btn-gold" id="btnLogin">ĐĂNG NHẬP</button>
                <p style="text-align:center; margin-top:8px; font-size:13px;">
                    <a href="#" id="forgotPasswordLink" style="color:#5f91ff;">Quên mật khẩu?</a>
                </p>
                <p style="text-align:center; margin-top:10px; font-size:13px; color:#a0aec0;">
                    <a href="#" id="showRegister" style="color:#5f91ff;">Chưa có tài khoản? Đăng ký</a>
                </p>
            </div>

            <div id="registerForm" style="display:none;">
                <input type="text" id="regUsername" placeholder="Tên đăng nhập" class="input">
                <input type="email" id="regEmail" placeholder="Email" class="input">
                <input type="password" id="regPassword" placeholder="Mật khẩu (ít nhất 7 ký tự)" class="input">
                <input type="password" id="regConfirmPassword" placeholder="Xác nhận mật khẩu" class="input">
                <button class="btn btn-success" id="btnRegister">ĐĂNG KÝ</button>
                <p style="text-align:center; margin-top:10px; font-size:13px; color:#a0aec0;">
                    <a href="#" id="showLogin" style="color:#5f91ff;">Đã có tài khoản? Đăng nhập</a>
                </p>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <p>Đang tải...</p>
    </div>
    <div id="app" style="display:none;">
        <div class="header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1 class="logo">🌿 CAYXUMMO</h1>
                <button id="btnNotifications" style="background:none; border:none; font-size:22px; cursor:pointer; position:relative;">
                    🔔
                    <span id="notifyBadge" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; padding:2px 6px; font-size:10px; display:none;">0</span>
                </button>
            </div>
            <div class="user-bar" id="userBar">
                <span>👤 ...</span>
                <span>🪙 0 xu</span>
            </div>
        </div>
        <div class="main-content" id="mainContent"></div>
        <div class="bottom-nav" id="bottomNav"></div>
    </div>
    <div id="toast" class="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- THÊM MỚI: cần cho Firebase Auth thật + Cloud Functions -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>

    <!-- ĐỔI: chuyển sang type="module" để dùng import/export -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
